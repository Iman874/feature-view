<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Fitur Repo Contoh</title>
<style>/* ==== 10-token.css ==== */
/* Lapis 1: token. Skala jarak/radius/tipografi, palet dua skema, rampa status dan grup.
   Tidak ada satu pun aturan yang memilih elemen di sini; semuanya nilai. */
/* ===========================================================================
   Skala. Semua angka tampilan lahir dari tiga keluarga token di bawah ini:
   jarak (kelipatan 4px), radius, dan tipografi (enam langkah, lantai 12px).
   Aturan ini dijaga oleh tes di src/aset.rs — menambah nilai telanjang baru
   membuat suite merah, jadi kerapihan tidak bisa melonggar diam-diam.
   =========================================================================== */
:root {
  color-scheme: light;
  /* Jarak: 2/4/8/12/16/24px. 2px khusus celah rambut di dalam badge dan chip. */
  --sp-1: 2px;
  --sp-2: 4px;
  --sp-3: 8px;
  --sp-4: 12px;
  --sp-5: 16px;
  --sp-6: 24px;
  /* Radius: satu tangga, tanpa nilai tengah seperti 5px atau 7px. */
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
  --r-pill: 999px;
  /* Tipografi: enam langkah, semua >= 12px. Yang 0.66-0.78rem lama naik ke sini. */
  --fs-1: 0.75rem;   /* 12px label, badge, legenda, meta   */
  --fs-2: 0.8125rem; /* 13px baris pohon, kontrol          */
  --fs-3: 0.875rem;  /* 14px teks panel dan tubuh          */
  --fs-4: 1rem;      /* 16px judul blok, angka graf        */
  --fs-5: 1.25rem;   /* 20px judul inspektur, label kartu  */
  --fs-6: 1.5rem;    /* 24px angka besar                   */
  /* Geometri: satu tinggi untuk semua kontrol pada satu baris, satu tinggi
     untuk semua baris pohon. Hierarki baris dibuat lewat bobot dan warna. */
  --kontrol-tinggi: 30px;
  --baris-tinggi: 24px;
  /* Satu tingkat redup untuk semua permukaan: dulu kanvas 0,14 dan rail 0,35. */
  --redup: 0.14;
}

/* ===========================================================================
   Palet. Satu skala netral 12 langkah per skema; tiap peran hanya menunjuk
   langkah, tidak pernah menulis hex sendiri. Status dan grup mengikuti SATU
   aturan hue: S/L tetap per skema (sama dengan yang dipakai rotasi sudut emas
   di render.js), lalu tiga peran dari satu hue — solid, teks, latar bernuansa.
   Skema dipilih lewat atribut `data-tema` pada <html>, yang dipasang
   render.js dari pilihan user atau preferensi OS. Tidak ada duplikasi blok.
   =========================================================================== */
:root {
  /* Netral hangat. Ramp lama kebiruan (#fcfcfd..#1c2024); langkahnya tetap sama,
     hanya kromanya ditarik ke arah kertas hangat supaya permukaan tidak terasa dingin.
     Tangga harus tetap monoton: 1 paling terang, 12 paling gelap. */
  --netral-1: #fffefa;
  --netral-2: #f7f6f2;
  --netral-3: #f1efe9;
  --netral-4: #eae7df;
  --netral-5: #e7e4dc;
  --netral-6: #e4e1d8;
  --netral-7: #dad6cb;
  --netral-8: #d1cdc2;
  --netral-9: #b9b4a8;
  --netral-10: #aaa9a2;
  --netral-11: #727670;
  --netral-12: #20231f;
  /* S/L kurasi warna. Yang terang (33%) adalah warna SOLID: ia harus tetap
     >= 4,5 ketika dipakai sebagai teks di atas panel, karena label aktor dan
     judul grup memakai warna grup apa adanya, bukan varian teks terpisah.
     Di skema gelap angkanya naik ke 62/66 karena latar panelnya turun.
     Saturasi diturunkan 45 -> 36 supaya hijau/biru/kuningnya jadi warna kerja,
     bukan warna sorotan; ambang 4,5 di atas tetap diukur, bukan dipercaya. */
  --sat: 36%;
  --terang: 33%;
  --tegas: 26%;
  --nuansa: 12%;
}
:root[data-tema="gelap"] {
  color-scheme: dark;
  /* Ramp gelap ikut dihangatkan: 1 paling gelap, 12 paling terang. */
  --netral-1: #131512;
  --netral-2: #181a17;
  --netral-3: #202320;
  --netral-4: #272a27;
  --netral-5: #2e312d;
  --netral-6: #363a35;
  --netral-7: #434840;
  --netral-8: #5a6158;
  --netral-9: #6f726b;
  --netral-10: #83867c;
  --netral-11: #a4a69f;
  --netral-12: #ecebe5;
  --sat: 62%;
  --terang: 66%;
  --tegas: 74%;
  --nuansa: 18%;
}

:root {
  /* Peran permukaan: dua langkah pertama latar, tiga langkah permukaan,
     6/8 garis, 11 teks lembut, 12 teks keras. Hanya dua langkah teks. */
  --bg: var(--netral-2);
  --kanvas: var(--netral-3);
  --titik: var(--netral-7);
  --panel: var(--netral-1);
  --panel-lembut: var(--netral-3);
  --teks: var(--netral-12);
  --teks-lembut: var(--netral-11);
  /* Teks baris daftar. --teks-lembut murni hanya 4,28 di atas rel terang, di bawah
     lantai 4,5 yang alat ini pakai untuk teks; satu sentuhan ke --teks menaikkan
     keduanya karena --teks selalu berada di sisi yang berlawanan dari rel. */
  --teks-baris: color-mix(in srgb, var(--teks-lembut) 80%, var(--teks));
  --jaringan: var(--netral-9);
  /* Garis gelap dibuat lapisan transparan, bukan hex baru, supaya satu nilai
     cocok di atas panel mana pun dan tetap terasa satu tingkat. */
  --garis: var(--netral-6);
  --garis-keras: var(--netral-8);
  /* Rel daftar dan baris terpilih harus SELALU satu langkah berlawanan. Menunjuk
     --panel untuk keduanya tidak bisa: di skema gelap --panel adalah langkah paling
     gelap, jadi kartu terpilih justru terlihat cekung di dalam relnya sendiri. */
  --rail: var(--netral-2);
  --rel: var(--netral-1);
}
:root[data-tema="gelap"] {
  --garis: rgba(255, 255, 255, 0.10);
  --garis-keras: rgba(255, 255, 255, 0.16);
  --rail: var(--netral-1);
  --rel: var(--netral-2);
}

:root {
  /* Rampa status: urutan sama dengan daftar `status` di konfigurasi peta
     (1 peran utama, 2 separuh, 3 mati, 4 sisanya). Yang mati memakai skala
     netral, bukan hue, karena ia memang bukan warna kategori. */
  --status-1: hsl(160 var(--sat) var(--terang));
  --status-1-teks: hsl(160 var(--sat) var(--tegas));
  --status-1-latar: color-mix(in srgb, var(--status-1) var(--nuansa), transparent);
  --status-2: hsl(40 var(--sat) var(--terang));
  --status-2-teks: hsl(40 var(--sat) var(--tegas));
  --status-2-latar: color-mix(in srgb, var(--status-2) var(--nuansa), transparent);
  --status-3: var(--netral-9);
  --status-3-teks: var(--netral-11);
  --status-3-latar: color-mix(in srgb, var(--status-3) var(--nuansa), transparent);
  --status-4: hsl(210 var(--sat) var(--terang));
  --status-4-teks: hsl(210 var(--sat) var(--tegas));
  --status-4-latar: color-mix(in srgb, var(--status-4) var(--nuansa), transparent);
  /* Alias posisional, dipakai kode tampilan (badge dan chip penanda).
     Ini nama token, bukan nama data. */
  --aktif: var(--status-1);
  --sebagian: var(--status-2);
  --mati: var(--status-3);
  --rencana: var(--status-4);
  --aksen: var(--status-1);
  --aksen-tegas: var(--status-1-teks);
  --aksen-lembut: var(--status-1-latar);
}

:root {
  /* Delapan hue grup dengan S/L yang sama persis dengan aturan status, lalu
     grup ke-9 dan seterusnya dirotasi sudut emas di render.js memakai S/L itu
     juga — jadi kurasi dan hasil generate tidak pernah beda keluarga. */
  --grup-1: hsl(160 var(--sat) var(--terang));
  --grup-2: hsl(210 var(--sat) var(--terang));
  --grup-3: hsl(40 var(--sat) var(--terang));
  --grup-4: hsl(265 var(--sat) var(--terang));
  --grup-5: hsl(350 var(--sat) var(--terang));
  --grup-6: hsl(185 var(--sat) var(--terang));
  --grup-7: hsl(90 var(--sat) var(--terang));
  --grup-8: hsl(320 var(--sat) var(--terang));
  --grup-9: hsl(230 var(--sat) var(--terang));
  --grup-10: hsl(25 var(--sat) var(--terang));
  --grup-11: hsl(140 var(--sat) var(--terang));
  --grup-12: hsl(285 var(--sat) var(--terang));
  --relasi-1: var(--grup-1);
  --relasi-2: var(--grup-2);
  --relasi-3: var(--grup-3);
  --relasi-4: var(--grup-4);
  --relasi-5: var(--grup-7);
  --relasi-6: var(--netral-9);
}

/* ==== 20-komponen.css ==== */
/* Lapis 2: komponen. Reset, kontrol, header, rel kiri, inspektur kanan. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: var(--fs-3);
  line-height: 1.5;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.lewati {
  position: absolute;
  left: -9999px;
  top: 0;
  padding: var(--sp-3) var(--sp-5);
  background: var(--panel);
  color: var(--teks);
  border: 1px solid var(--garis);
  border-radius: var(--r-md);
  z-index: 40;
}
.lewati:focus { left: var(--sp-4); top: var(--sp-4); }
code {
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: var(--fs-2);
  word-break: break-word;
}
button { font: inherit; }

.ikon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: 0 0 auto;
  display: block;
}
i, .ikon-bungkus { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
i .ikon, .ikon-bungkus .ikon { width: 1rem; height: 1rem; }
.ikon-saja { padding: var(--sp-2); min-width: var(--kontrol-tinggi); min-height: var(--kontrol-tinggi); justify-content: center; }
.ikon-saja .ikon { width: 1.05rem; height: 1.05rem; }
.ikon-besar .ikon, .ikon-besar { width: 1.6rem; height: 1.6rem; }

.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.bar {
  flex: 0 0 auto;
  min-height: 56px;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-5);
  background: var(--panel);
  border-bottom: 1px solid var(--garis);
}
.bar-merek { display: flex; align-items: baseline; gap: var(--sp-4); flex-wrap: wrap; min-width: 0; }
.bar h1 {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: var(--fs-4);
  font-weight: 700;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
/* Kotak merek memakai huruf pertama dari nama yang dibaca config, bukan huruf
   yang ditulis di kode tampilan: alat ini tidak boleh mengenal merek pemakainya. */
.bar h1[data-inisial]:not([data-inisial=""])::before {
  content: attr(data-inisial);
  width: 26px;
  height: 26px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: var(--r-md);
  background: var(--teks);
  color: var(--bg);
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: 0;
}
.bar-alat { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-left: auto; }
/* Menu alat: lima aksi dikumpulkan di satu pemicu titik tiga. Popupnya duduk di bawah
   pemicunya, rata kanan, dan memakai permukaan panel yang sama dengan laci rel. */
.menu-alat { position: relative; display: inline-flex; }
.menu-alat-isi {
  position: absolute;
  top: calc(100% + var(--sp-2));
  right: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  min-width: 190px;
  padding: var(--sp-2);
  background: var(--panel);
  border: 1px solid var(--garis);
  border-radius: var(--r-lg);
  box-shadow: 0 var(--sp-3) 24px rgba(0, 0, 0, 0.18);
}
.menu-alat-isi.ke-kiri { left: 0; right: auto; }
.menu-alat-isi .tombol {
  width: 100%;
  justify-content: flex-start;
  border: 0;
  border-radius: var(--r-md);
  background: none;
  color: var(--teks-baris);
  font-size: var(--fs-2);
}
.menu-alat-isi .tombol:hover { background: var(--panel-lembut); color: var(--teks); border: 0; }

.badan { flex: 1 1 auto; display: flex; min-height: 0; }
.peta { position: relative; flex: 1 1 auto; min-width: 0; background: var(--kanvas); }
#jejaring { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#jejaring.menyeret { cursor: grabbing; }

.alat-peta {
  position: absolute;
  left: var(--sp-4);
  bottom: var(--sp-4);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  background: var(--panel);
  border: 1px solid var(--garis);
  border-radius: var(--r-lg);
}
.alat-peta .tombol { min-width: var(--kontrol-tinggi); justify-content: center; padding: var(--sp-2); font-size: var(--fs-1); border-radius: var(--r-md); }
.zoom-tingkat { padding: 0 var(--sp-2); color: var(--teks-lembut); font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
/* Chip penanda manifest. Atribut hidden harus menang atas display di bawah,
   kalau tidak chip bocor ke layar saat belum ada perubahan. */
.kap[hidden] { display: none; }
.kap {
  display: inline-block;
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--garis-keras);
  border-radius: var(--r-pill);
  background: var(--panel);
  color: var(--teks);
  font-size: var(--fs-1);
  font-weight: 600;
  cursor: pointer;
}
.kap:hover { border-color: var(--aksen); color: var(--aksen); }
.kap.bahaya { border-color: var(--sebagian); color: var(--sebagian); }
.kap.bahaya:hover { border-color: var(--sebagian); color: var(--sebagian); }
.minimap {
  position: absolute;
  right: var(--sp-4);
  bottom: var(--sp-4);
  z-index: 5;
  width: 190px;
  height: 124px;
  background: var(--panel);
  border: 1px solid var(--garis);
  border-radius: var(--r-lg);
  overflow: hidden;
  cursor: crosshair;
}
#minimap { display: block; width: 100%; height: 100%; }
#minimap .mini-edge { stroke-opacity: 0.2; }
#minimap .mini-node { opacity: 0.8; }
#minimap .mini-viewport { fill: var(--aksen); fill-opacity: 0.12; stroke: var(--aksen); stroke-width: 12; }

.pohon {
  flex: 0 0 286px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--rail);
  border-right: 1px solid var(--garis);
  font-size: var(--fs-2);
}
/* Baris tab rel kiri: struktur dan pekerjaan bergantian, bukan bertumpuk. Perawatannya
   sama dengan tab papan yang disetujui 0.4.3 -- rambut di bawah baris, garis bawah 2px
   untuk yang terpilih, tanpa kotak. */
.sisi-tab {
  flex: 0 0 auto;
  display: flex;
  align-items: stretch;
  min-height: 54px;
  padding: 0 var(--sp-3);
  border-bottom: 1px solid var(--garis);
}
.sisi-tab-tombol {
  flex: 1 1 0;
  min-width: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0 var(--sp-2);
  border: 0;
  background: transparent;
  /* --teks-baris, bukan --teks-lembut: yang lembut murni hanya 4,28 terhadap rel di skema
     terang dan baris tab ini teks navigasi, bukan hiasan. Angka 5,47 hasil ukur ulang. */
  color: var(--teks-baris);
  font: inherit;
  font-size: var(--fs-1);
  cursor: pointer;
}
/* `width: 0` wajib di samping `flex: 1 1 0`: tanpa itu satu label nowrap ikut dihitung
   sebagai lebar minimum kolom dan rail menolak menyusut ke 286px. */
.sisi-tab-tombol span { flex: 1 1 0; width: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Hanya tab status yang dinaikkan hurufnya: nama sumbu dikirim render.js sudah benar kapitalnya,
   dan "Sub-fitur" tidak boleh berubah wujud jadi "Sub-Fitur". */
.sisi-tab-status span { text-transform: capitalize; }
.sisi-tab-tombol .papan-angka { flex: 0 0 auto; }
.sisi-tab-tombol.terpilih { background: none; box-shadow: none; color: var(--teks); font-weight: 600; }
.sisi-tab-tombol.terpilih::after {
  content: '';
  position: absolute;
  left: 20%;
  right: 20%;
  bottom: -1px;
  height: 2px;
  border-radius: var(--r-sm);
  background: var(--teks);
}
.sisi-tab-tombol:focus-visible { outline: 2px solid var(--aksen-tegas); outline-offset: 2px; }
.sisi-tab-alat { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-2); }
/* Angka jumlah adalah properti rel kiri -- ia menghitung isi rel -- jadi ia duduk di bawah
   tab, bukan di baris merek. Dua baris pil lebih baik daripada satu baris yang memaksa kolom
   melebar; tingginya tidak ikut menghitung isi karena ia `flex: 0 0 auto` di atas kolom. */
.sisi-info {
  flex: 0 0 auto;
  margin: 0;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--garis);
  color: var(--teks-lembut);
  font-size: var(--fs-1);
}
.sisi-info span {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 26px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-md);
  background: var(--panel-lembut);
  white-space: nowrap;
}
.sisi-info i { color: var(--teks-baris); }
.sisi-info b { color: var(--teks); font-weight: 700; font-variant-numeric: tabular-nums; }
/* Panel: tingginya diambil dari kolom, bukan dari isi. Kolomnya sendiri dipatok
   `.app { height: 100dvh }`, jadi satu panel yang panjang tidak pernah bisa mendorong
   panel lain keluar layar -- mereka tidak tampil bersamaan. */
.sisi-panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.pohon-kecil { display: none; }
.pohon-isi { flex: 1 1 auto; overflow: auto; padding: 0 var(--sp-3) var(--sp-3); }
.pohon-grup { margin-top: var(--sp-3); }
.pohon-grup:first-child { margin-top: 0; }
.pohon-grup h3 {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: calc(var(--kontrol-tinggi) + var(--sp-2));
  margin: 0 0 var(--sp-1);
  padding: 0 var(--sp-2);
  background: var(--rail);
  border-radius: var(--r-md);
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  /* Warna grup dipakai apa adanya, sesuai aturan skala di kepala berkas: hue ke-12
     terlemah tetap 5,06 terhadap rel terang, jadi lantai 4,5 tidak butuh varian teks. */
  color: var(--grup-warna, var(--teks-baris));
}
.pohon-grup-tombol {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  min-height: calc(var(--kontrol-tinggi) + var(--sp-2));
  padding: 0 var(--sp-1);
  background: none;
  border: 0;
  border-radius: var(--r-md);
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  text-align: left;
  cursor: pointer;
}
.pohon-grup-tombol:hover { background: var(--panel-lembut); }
.pohon-grup-tombol .chevron { width: 0.7rem; height: 0.7rem; transition: transform 0.12s linear; }
.pohon-grup.tertutup .pohon-grup-tombol .chevron { transform: rotate(0deg); }
.pohon-grup:not(.tertutup) .pohon-grup-tombol .chevron { transform: rotate(90deg); }
.pohon-grup.tertutup .pohon-item { display: none; }
.pohon-grup h3 span { flex: 1 1 0; width: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pohon-grup h3 b { font-weight: 700; color: var(--teks); font-variant-numeric: tabular-nums; }
.pohon-grup h3 .ikon { width: 0.9rem; height: 0.9rem; }
.pohon-detail summary .ikon { width: 0.8rem; height: 0.8rem; }
.bagian > summary > .ikon { width: 1rem; height: 1rem; }
.pohon-item { border-radius: var(--r-md); }
.pohon-pilih {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: var(--kontrol-tinggi);
  padding: 0 var(--sp-5) 0 var(--sp-4);
  background: none;
  border: 0;
  border-radius: var(--r-md);
  color: var(--teks-baris);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
/* `width: 0` wajib ada di samping flex-basis, sama seperti .papan-nama: tanpa itu teks nowrap
   ikut dihitung sebagai lebar minimum kolom dan sidebar menolak menyusut ke basisnya
   (terukur 321px terhadap basis 286px). */
.pohon-nama { flex: 1 1 0; width: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pohon-pilih:hover, .pohon-sub:hover { background: var(--panel-lembut); color: var(--teks); }
/* Baris terpilih mengikuti kartu terpilih di kanvas: satu langkah naik ke permukaan
   yang lebih terang dari relnya, plus rambut setebal satu piksel. Tidak ada sapuan
   warna aksen — itu yang membuat satu baris berteriak di tengah daftar netral. */
.pohon-pilih.terpilih, .pohon-sub.terpilih {
  background: var(--rel);
  color: var(--teks);
  font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--garis);
}
.pohon-detail { margin: 0 0 var(--sp-1) var(--sp-4); padding-left: var(--sp-3); border-left: 1px solid var(--garis); }
.pohon-detail ul { list-style: none; margin: 0 0 var(--sp-3); padding-left: var(--sp-1); }
.pohon-detail summary {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--baris-tinggi);
  cursor: pointer;
  list-style: none;
  padding: 0 var(--sp-2);
  color: var(--teks-baris);
  font-size: var(--fs-1);
  border-radius: var(--r-md);
}
.pohon-detail summary::-webkit-details-marker { display: none; }
.pohon-detail summary:hover { background: var(--panel-lembut); }
/* Tanpa satuan, baris ini hanya chevron dan angka telanjang yang terbaca sebagai baris rusak. */
.pohon-detail summary .pohon-angka { color: var(--teks); font-weight: 600; }
.pohon-detail summary .pohon-satuan { color: var(--teks-baris); }
.pohon-detail summary .chevron { transition: transform 0.12s linear; }
.pohon-detail[open] > summary .chevron { transform: rotate(90deg); }
.pohon-angka { font-variant-numeric: tabular-nums; }
.pohon-sub {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: var(--baris-tinggi);
  padding: 0 var(--sp-2);
  background: none;
  border: 0;
  border-radius: var(--r-md);
  color: var(--teks-baris);
  font: inherit;
  font-size: var(--fs-2);
  text-align: left;
  cursor: pointer;
}
.pohon .redup { opacity: var(--redup); }
.status-titik { flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.pohon-kaki {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--garis);
  font-size: var(--fs-1);
  color: var(--teks-lembut);
}
.pohon-kaki .hasil { margin: 0; }

.detail {
  flex: 0 0 340px;
  overflow: auto;
  padding: var(--sp-4) var(--sp-5) var(--sp-6);
  background: var(--panel);
  border-left: 1px solid var(--garis);
  font-size: var(--fs-3);
}
.detail-kosong {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-5);
  margin-top: calc(var(--sp-6) * 2);
  color: var(--teks-lembut);
}
.detail-kosong i .ikon { width: 2rem; height: 2rem; stroke-width: 1.2; }
.detail-kosong p { margin: 0; font-size: var(--fs-3); }
.jejak {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-5);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--garis);
  color: var(--teks-lembut);
  font-size: var(--fs-1);
}
.jejak .pemisah { width: 0.8rem; height: 0.8rem; color: var(--garis-keras); }
.jejak-aktif { color: var(--teks); font-weight: 600; }
.detail-kepala { display: flex; align-items: flex-start; gap: var(--sp-5); }
.detail-kepala h2 { margin: 0 0 var(--sp-2); font-size: var(--fs-5); line-height: 1.25; letter-spacing: -0.01em; }
.detail-kepala > .ikon { width: 1.5rem; height: 1.5rem; margin-top: var(--sp-2); color: var(--aksen); }
.tile-kepala {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.1rem;
  height: 2.1rem;
  border-radius: var(--r-lg);
  background: color-mix(in srgb, var(--grup-warna, var(--aksen)) var(--nuansa), transparent);
  color: var(--grup-warna, var(--aksen-tegas));
}
.tile-kepala .ikon { width: 1.2rem; height: 1.2rem; stroke-width: 2; }
.ringkas { margin: var(--sp-3) 0 0; color: var(--teks-lembut); font-size: var(--fs-3); }
.kunci {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin: var(--sp-4) 0 0;
  padding: var(--sp-3) var(--sp-4);
  background: var(--aksen-lembut);
  border-radius: var(--r-md);
  color: var(--aksen-tegas);
  font-size: var(--fs-2);
  font-weight: 600;
}
.kunci .ikon { width: 1rem; height: 1rem; }
/* Panel inspektur datar: dipisah rambut di atas, bukan kotak berbingkai. */
.bagian { margin-top: 0; border: 0; border-top: 1px solid var(--garis); border-radius: 0; }
.bagian > summary {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  min-height: 48px;
  padding: var(--sp-3) 0;
  cursor: pointer;
  list-style: none;
  color: var(--teks);
  font-size: var(--fs-3);
  font-weight: 600;
}
.bagian > summary::-webkit-details-marker { display: none; }
.bagian > summary span { flex: 1 1 auto; }
.bagian > summary .chevron { width: 0.85rem; height: 0.85rem; transition: transform 0.12s linear; }
.bagian[open] > summary .chevron { transform: rotate(90deg); }
.bagian-isi { padding: var(--sp-1) 0 var(--sp-5); }
.bagian-sub {
  margin: var(--sp-3) 0 var(--sp-2);
  color: var(--teks-lembut);
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.detail p { margin: var(--sp-3) 0; font-size: var(--fs-3); }
.detail ul { margin: var(--sp-3) 0; padding-left: var(--sp-5); font-size: var(--fs-3); }
.detail li { margin: var(--sp-2) 0; }
.detail ul ul { margin: var(--sp-2) 0 var(--sp-4); padding-left: var(--sp-5); }
.dot-list { list-style: none; padding-left: 0; }
.dot-list > li { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-3); }
.tautan-list { list-style: none; padding-left: 0; }
.tautan-list > li { padding: var(--sp-1) 0; }
.relasi-list { list-style: none; padding-left: 0; }
.relasi-list > li { display: flex; align-items: baseline; gap: var(--sp-3); padding: var(--sp-1) 0; }
.relasi-label { color: var(--teks-lembut); font-size: var(--fs-1); }
.operasi-list { list-style: none; padding-left: 0; }
.operasi-list > li { padding: var(--sp-1) 0; }
.daftar-sub > li { margin-bottom: var(--sp-3); }
.detail a { color: var(--aksen-tegas); text-underline-offset: 2px; }
.detail-badge { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-2); }
.badge-status {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--garis);
  border-radius: var(--r-sm);
  font-size: var(--fs-1);
  font-weight: 700;
}
.badge-service {
  display: inline-flex;
  padding: var(--sp-1) var(--sp-3);
  background: var(--panel-lembut);
  border-radius: var(--r-sm);
  font-size: var(--fs-1);
  color: var(--teks-lembut);
}
.badge-aktif { color: var(--aktif); border-color: var(--aktif); background: var(--status-1-latar); }
.badge-sebagian { color: var(--sebagian); border-color: var(--sebagian); background: var(--status-2-latar); }
.badge-dimatikan { color: var(--mati); border-color: var(--mati); background: var(--status-3-latar); }
.badge-direncanakan { color: var(--rencana); border-color: var(--rencana); background: var(--status-4-latar); }
.tautan-node {
  padding: 0;
  background: none;
  border: 0;
  color: var(--aksen-tegas);
  font: inherit;
  font-size: inherit;
  text-align: left;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.detail-kecil { margin: var(--sp-2) 0; color: var(--teks-lembut); font-size: var(--fs-2); }

/* Legenda dijinjing satu tombol `i` di kanan atas kanvas, bukan ditumpuk di sidebar:
   ia referensi sesekali, bukan navigasi utama, dan 145px yang ia makan di kolom kiri
   lebih berguna untuk daftar struktur. Popupnya anak dari .peta (yang sudah relative),
   bukan anak <svg>, jadi menggeser peta tidak pernah menyeretnya. */
.info-peta { position: absolute; top: var(--sp-4); right: var(--sp-4); z-index: 6; }
/* `.tombol` memberi padding 0 12px dan `.ikon-saja` hanya min-width, jadi tanpa lebar dan
   padding yang ditekan tombolnya jadi pil 42x30, bukan bundar 30x30 seperti kontrol ikon lain. */
.tombol-info { width: var(--kontrol-tinggi); padding: 0; border-radius: var(--r-pill); }
.tombol-info[aria-expanded="true"] { border-color: var(--garis-keras); color: var(--teks); }
.legenda {
  color: var(--teks-lembut);
  font-size: var(--fs-1);
}
.legenda-popover {
  position: absolute;
  top: calc(var(--kontrol-tinggi) + var(--sp-2));
  right: 0;
  width: 262px;
  padding: var(--sp-4);
  border: 1px solid var(--garis);
  border-radius: var(--r-lg);
  background: var(--panel);
  box-shadow: 0 var(--sp-3) var(--sp-6) rgba(0, 0, 0, 0.16);
}
.legenda > div { margin-top: var(--sp-4); }
.legenda > div:first-child { margin-top: 0; }
.legenda h2 { display: flex; align-items: center; gap: var(--sp-3); margin: 0 0 var(--sp-2); color: var(--teks-lembut); font-size: var(--fs-1); font-weight: 600; }
.legenda h2 .ikon { width: 0.95rem; height: 0.95rem; }
.legenda-baris { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); }
.legenda-item { display: inline-flex; align-items: center; gap: var(--sp-3); }
.bar-legenda { width: 0.28rem; height: 0.75rem; border-radius: var(--r-sm); display: inline-block; }
.garis-legenda { width: 1.1rem; border-top: 2px solid currentColor; display: inline-block; }

.cari { position: relative; display: block; padding: var(--sp-4) var(--sp-5) var(--sp-3); }
/* Tengah vertikal dihitung dari tinggi masukan, bukan angka telanjang: kalau
   --kontrol-tinggi atau tinggi masukan berubah, ikonnya ikut, tidak naik ke tepi atas. */
.cari i { position: absolute; left: var(--sp-5); top: calc(var(--sp-4) + (var(--kontrol-tinggi) + var(--sp-2) - 1rem) / 2); color: var(--teks-lembut); pointer-events: none; }
.cari input {
  width: 100%;
  min-height: calc(var(--kontrol-tinggi) + var(--sp-2));
  padding: var(--sp-2) var(--sp-3) var(--sp-2) 1.9rem;
  background: var(--rel);
  color: var(--teks);
  border: 1px solid var(--garis);
  border-radius: var(--r-lg);
  font: inherit;
  font-size: var(--fs-2);
}
.pilih-kontrol { display: flex; align-items: center; gap: var(--sp-3); color: var(--teks-lembut); }
.pilih-kontrol select {
  min-height: var(--kontrol-tinggi);
  padding: var(--sp-2) var(--sp-6) var(--sp-2) var(--sp-3);
  background: var(--bg);
  color: var(--teks);
  border: 1px solid var(--garis);
  border-radius: var(--r-md);
  font: inherit;
  font-size: var(--fs-2);
}
.segmen { display: inline-flex; align-items: stretch; min-height: var(--kontrol-tinggi); padding: var(--sp-1); background: var(--bg); border: 1px solid var(--garis); border-radius: var(--r-md); }
.segmen .tombol { border: 0; border-radius: var(--r-sm); min-height: 0; padding: 0 var(--sp-3); background: transparent; font-size: var(--fs-2); }
.segmen .tombol .ikon { width: 0.95rem; height: 0.95rem; }
.segmen .tombol + .tombol { margin-left: var(--sp-1); }
.segmen .tombol.terpilih { background: var(--panel); box-shadow: inset 0 0 0 1px var(--garis); color: var(--aksen-tegas); font-weight: 600; }
.tombol {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: var(--kontrol-tinggi);
  padding: 0 var(--sp-4);
  background: var(--panel);
  color: var(--teks);
  border: 1px solid var(--garis);
  border-radius: var(--r-md);
  font-size: var(--fs-2);
  cursor: pointer;
}
.tombol:hover { border-color: var(--garis-keras); }
/* display:inline-flex di atas mengalahkan aturan default [hidden], jadi dijaga eksplisit. */
.tombol[hidden] { display: none; }
.tombol.terpilih { background: var(--aksen-lembut); border-color: var(--aksen); color: var(--aksen-tegas); font-weight: 600; }
.tombol-pohon { display: none; }
.pohon-tutup { display: none; }
.tombol:focus-visible, .cari input:focus-visible, .pilih-kontrol select:focus-visible,
.kap:focus-visible,
.pohon-pilih:focus-visible, .pohon-sub:focus-visible, .node:focus-visible, .tautan-node:focus-visible,
.pohon-grup-tombol:focus-visible, .bagian > summary:focus-visible, .pohon-detail summary:focus-visible {
  outline: 2px solid var(--aksen);
  outline-offset: var(--sp-2);
}
.hasil {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin: 0;
  padding: 0 var(--sp-5) var(--sp-3);
  border-bottom: 1px solid var(--garis);
  color: var(--teks-lembut);
  font-size: var(--fs-1);
}
.hasil .ikon { width: 0.95rem; height: 0.95rem; }
.hasil b { color: var(--teks); font-weight: 700; font-variant-numeric: tabular-nums; }
.hasil span { color: var(--teks-lembut); }
/* Rel tidak memakai garis pemisah di bawah ringkasan: relnya sudah beda satu
   langkah permukaan dari panel di kanan kanvas. */
.pohon .hasil { padding-left: var(--sp-5); border-bottom: 0; color: var(--teks-baris); }
.pohon .hasil span { color: var(--teks-baris); }

/* ==== 30-layar.css ==== */
/* Lapis 3: layar. Kanvas graf, papan pekerjaan, dan media query responsif. */
#jejaring .node { cursor: pointer; }
#jejaring .ikon { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#jejaring .klaster-kepala { opacity: 0.95; }
#jejaring .titik-kanvas { fill: var(--titik); }
#jejaring .node-tile { fill-opacity: 0.16; stroke: none; }
#jejaring .node-pill { fill: var(--panel-lembut); stroke: var(--garis); stroke-width: 1; }
#jejaring .node-kotak { fill: var(--panel); stroke: var(--garis-keras); stroke-width: 1.5; }
#jejaring .node:hover .node-kotak { stroke: var(--aksen); }
/* Kartu terpilih: garis tepi gelap tipis + bayangan halus. Bekasnya sorotan warna
   9px (drop-shadow 0 0 9px var(--aksen)) membuat satu kartu menyala di atas kanvas;
   aturan proyek melarang efek menyala, jadi penanda dipilih dipindah ke tepi dan
   kedalaman, bukan ke cahaya. */
#jejaring .node.terpilih { filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.20)); }
#jejaring .node.terpilih .node-kotak { stroke: var(--teks); stroke-width: 1.5; }
#jejaring .node-aksen { stroke: none; }
#jejaring .node-teks { fill: var(--teks); font-size: var(--fs-5); font-weight: 600; dominant-baseline: middle; }
#jejaring .node-jumlah { fill: var(--teks-lembut); font-size: var(--fs-3); font-weight: 600; dominant-baseline: middle; }
#jejaring .node.redup { opacity: var(--redup); }
#jejaring .node.buram { opacity: 0.18; }
/* Kartu terpilih adalah kartu yang sedang dijelaskan panel inspektur: ia tidak boleh
   ikut diredup oleh penyaring, kalau tidak auditor menjelaskan kartu yang nyaris tak terlihat. */
#jejaring .node.terpilih { opacity: 1; }
#jejaring .node.cari-cocok .node-kotak { stroke: var(--aksen); }
/* Zoom semantik: jauhkan kamera maka teks berhenti dikejar. Di bawah ambang skala
   kartu menyusut jadi cip (tile ikon + strip status) supaya bentuk grafiknya terbaca. */
#jejaring.simpl .node-teks,
#jejaring.simpl .node-pill,
#jejaring.simpl .node-jumlah,
#jejaring.simpl .node-progres { display: none; }
#jejaring.simpl .node-kotak { width: 54px; }
/* Garis tetap latar, bukan subjek: tiap garis memakai hue jenis relasinya sejak awal supaya
   legenda "Relasi" benar, tapi opacity dijaga rendah (0,26) karena 108 garis penuh warna akan
   mengubah peta jadi semak. Kartu terpilih menaikkan hue-nya sendiri lewat .terkait. */
#jejaring .edge { fill: none; stroke: var(--jenis-warna, var(--jaringan)); stroke-width: 1; stroke-opacity: 0.26; }
#jejaring .edge.redup { stroke-opacity: 0.05; }
#jejaring .edge.buram { stroke-opacity: 0.05; }
#jejaring .edge.terkait { stroke: var(--jenis-warna, var(--aksen)); stroke-width: 2.2; stroke-opacity: 0.95; }
#jejaring .klaster { fill-opacity: 0.05; stroke-opacity: 0.45; stroke-width: 1.2; }
#jejaring .klaster-label { fill: var(--teks-lembut); font-size: var(--fs-4); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
#jejaring .klaster-jumlah { fill: var(--garis-keras); font-weight: 600; }

@media (min-width: 1181px) {
  .pohon-kecil { display: inline-flex; }
  .pohon.kecil { flex-basis: 52px; }
  .pohon.kecil .sisi-tab { justify-content: center; padding: var(--sp-3); }
  .pohon.kecil .sisi-tab-tombol, .pohon.kecil .sisi-info, .pohon.kecil .pohon-tutup,
  .pohon.kecil .cari, .pohon.kecil .hasil, .pohon.kecil .papan,
  .pohon.kecil .pohon-nama, .pohon.kecil .pohon-angka, .pohon.kecil .status-titik,
  .pohon.kecil .pohon-detail, .pohon.kecil .pohon-grup h3 span, .pohon.kecil .pohon-grup h3 b,
  .pohon.kecil .pohon-grup-tombol .chevron { display: none; }
  .pohon.kecil .pohon-isi { padding: var(--sp-3) var(--sp-3); }
  .pohon.kecil .pohon-grup { margin-top: var(--sp-5); }
  .pohon.kecil .pohon-grup h3, .pohon.kecil .pohon-grup-tombol { justify-content: center; padding: 0; }
  .pohon.kecil .pohon-pilih, .pohon.kecil .pohon-sub { justify-content: center; gap: 0; padding: var(--sp-1) 0; }
  .pohon.kecil .pohon-item { margin-bottom: var(--sp-1); }
  .pohon.kecil .ikon-bungkus {
    width: 1.7rem;
    height: 1.7rem;
    border-radius: var(--r-md);
    background: color-mix(in srgb, var(--grup-warna, var(--aksen)) var(--nuansa), transparent);
  }
  /* Di rail kecil penanda terpilih sudah cincin aksen di sekeliling ikon. Cincang rambut
     dari .terpilih penuh di atas menumpuk jadi dua bingkai di kotak 52px, jadi dimatikan. */
  .pohon.kecil .pohon-pilih.terpilih, .pohon.kecil .pohon-sub.terpilih { background: none; box-shadow: none; }
  .pohon.kecil .pohon-pilih.terpilih .ikon-bungkus,
  .pohon.kecil .pohon-sub.terpilih .ikon-bungkus { outline: 2px solid var(--aksen); outline-offset: var(--sp-1); }
}
@media (max-width: 1180px) {
  .pohon {
    display: none;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 30;
    width: min(320px, 88vw);
    flex-basis: auto;
    box-shadow: 0 0 0 1px var(--garis), 0 var(--sp-6) 32px rgba(0, 0, 0, 0.22);
  }

/* --- papan pekerjaan (tugas.tsv) ---
   Panel ini hanya diisi kalau repo memakainya, jadi tidak ada satu pun gaya yang berlaku saat
   `tugas.tsv` tidak ada. Insetnya sama dengan blok tetangga di kolom yang sama, supaya satu
   sidebar tidak punya dua inset dan dua tangga judul. Status TIDAK dipilih
   lewat nama di sini: nama status adalah data dari config.tsv dan kode tampilan tidak boleh
   mengenalnya. Yang beranimasi hanya baris yang angkanya sungguh di antara nol dan seratus;
   baris 0% diam, karena gerak akan mengklaim pekerjaan yang belum berjalan. */
.papan {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: var(--sp-5);
  color: var(--teks-lembut);
  font-size: var(--fs-1);
}
/* Tingginya tidak pernah ikut isi. Panel ini adalah SATU dari dua panel rel yang
   bergantian lewat tab, dan kolomnya sendiri dipatok `.app { height: 100dvh }`, jadi yang
   membatasi adalah kolomnya -- bukan langit-langit angka seperti sebelum 0.4.4 (168px,
   waktu kedua daftar masih bertumpuk dan yang bawah bisa mendorong yang atas keluar layar). */
.papan-isi { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.papan-baris + .papan-baris { margin-top: var(--sp-4); }
.papan-kepala { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); }
/* `width: 0` wajib ada di samping flex-basis: tanpa itu, satu judul tugas yang panjang
   ikut dihitung sebagai lebar minimum kolom dan sidebar membengkak dari 321px jadi 390px
   (diukur; `flex: 1 1 0` saja tidak cukup). */
.papan-nama { flex: 1 1 0; width: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-2); color: var(--teks); }
.papan-angka { font-size: var(--fs-2); font-weight: 700; color: var(--aksen-tegas); font-variant-numeric: tabular-nums; }
.papan-rel { margin-top: var(--sp-1); font-size: var(--fs-1); }
/* Jalur harus bisa dilihat: --panel-lembut hanya 1,18:1 terhadap panel, dan batang kosong
   di jalur yang tidak terlihat membuat baris terbaca rusak. Campuran 55% teks-lembut,
   diukur dari warna hasil render (bukan nama token): jalur terhadap panel 3,11:1 (gelap)
   dan 2,10:1 (terang); isi batang memakai --aksen-tegas dan terhadap jalurnya 4,05:1
   (gelap) dan 3,73:1 (terang), keduanya di atas ambang WCAG 1.4.11 = 3:1. Yang diikat 3:1
   adalah isi batang sebagai tanda bermakna, bukan sisa jalurnya. Cip di bawahnya sengaja
   lebih lemah (28%): ia mengemban teks 12px, bukan hanya bentuk. */
.papan-jalur { position: relative; margin-top: var(--sp-2); height: 4px; overflow: hidden; border-radius: var(--r-pill); background: color-mix(in srgb, var(--teks-lembut) 55%, transparent); }
.papan-batang { position: relative; height: 100%; overflow: hidden; border-radius: var(--r-pill); background: var(--aksen-tegas); }

  position: absolute;
  top: 0;
  bottom: 0;
  left: -40%;
  width: 40%;
  background: linear-gradient(90deg, transparent, var(--panel), transparent);
  animation: papan-berjalan 2.4s linear infinite;
}
@keyframes papan-berjalan {
  from { left: -40%; }
  to { left: 100%; }
}
.papan-kaki { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); }

/* Id sub-fitur adalah rujukan, bukan kalimat: dipakai apa adanya supaya bisa dicari,
