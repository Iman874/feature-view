<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Fitur Repo Contoh</title>
<style>:root {
  color-scheme: light dark;
  --bg: #f2f3f5;
  --kanvas: #eaedf1;
  --titik: #c5ccd5;
  --panel: #ffffff;
  --panel-lembut: #eceff3;
  --teks: #1a2027;
  --teks-lembut: #63707e;
  --garis: #d5dae1;
  --garis-keras: #bcc4ce;
  --jaringan: #97a3b0;
  --aksen: #1f7a5c;
  --aksen-lembut: #e2f2ea;
  --status-1: #1f7a5c;
  --status-2: #9a6a1f;
  --status-3: #7c8794;
  --status-4: #2f6a99;
  /* Alias posisional dari rampa status, dipakai kode tampilan (badge dan chip penanda).
     Urutannya sama dengan daftar `status` di konfigurasi peta: 1 peran utama,
     2 peran separuh, 3 peran mati, 4 sisanya. Ini nama token, bukan nama data. */
  --aktif: var(--status-1);
  --sebagian: var(--status-2);
  --mati: var(--status-3);
  --rencana: var(--status-4);
  /* Satu tingkat redup untuk semua permukaan: dulu kanvas 0,14 dan rail 0,35. */
  --redup: 0.14;
  --grup-1: #1f7a5c;
  --grup-2: #2f6a99;
  --grup-3: #9a6a1f;
  --grup-4: #6a5a99;
  --grup-5: #99494f;
  --grup-6: #2f7a75;
  --grup-7: #5f7a2f;
  --grup-8: #b0617f;
  --grup-9: #4f7f9c;
  --grup-10: #7f6b3f;
  --grup-11: #3f8f8a;
  --grup-12: #9c4f6b;
  --relasi-1: #1f7a5c;
  --relasi-2: #2f6a99;
  --relasi-3: #9a6a1f;
  --relasi-4: #6a5a99;
  --relasi-5: #5f7a2f;
  --relasi-6: #7c8794;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1319;
    --kanvas: #12181f;
    --titik: #253141;
    --panel: #171f26;
    --panel-lembut: #1e2731;
    --teks: #e9eef3;
    --teks-lembut: #94a3b2;
    --garis: #2a343f;
    --garis-keras: #3d4a58;
    --jaringan: #5d6f80;
    --aksen: #3dd89d;
    --aksen-lembut: #123128;
    --status-1: #3dd89d;
    --status-2: #f8a840;
    --status-3: #7b8794;
    --status-4: #4d9fd6;
    /* Alias dipakai lagi di skema gelap supaya badge dan chip ikut warna rampa
       status yang berlaku, tidak tertinggal satu tingkat terang. */
    --aktif: var(--status-1);
    --sebagian: var(--status-2);
    --mati: var(--status-3);
    --rencana: var(--status-4);
    --redup: 0.14;
    --grup-1: #3dd89d;
    --grup-2: #4d9fd6;
    --grup-3: #f8a840;
    --grup-4: #a78bfa;
    --grup-5: #f2789f;
    --grup-6: #5fd0c5;
    --grup-7: #b8d24a;
    --grup-8: #d68fd0;
    --grup-9: #7fb6d6;
    --grup-10: #c9b078;
    --grup-11: #7fd6c5;
    --grup-12: #f2a0b8;
    --relasi-1: #3dd89d;
    --relasi-2: #4d9fd6;
    --relasi-3: #f8a840;
    --relasi-4: #a78bfa;
    --relasi-5: #b8d24a;
    --relasi-6: #94a3b2;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.5;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.lewati {
  position: absolute;
  left: -9999px;
  top: 0;
  padding: 0.5rem 0.8rem;
  background: var(--panel);
  color: var(--teks);
  border: 1px solid var(--garis);
  border-radius: 6px;
  z-index: 40;
}
.lewati:focus { left: 0.75rem; top: 0.75rem; }
code {
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 0.86em;
  word-break: break-word;
}
button { font: inherit; }

.ikon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: 0 0 auto;
  display: block;
}
i, .ikon-bungkus { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
i .ikon, .ikon-bungkus .ikon { width: 1rem; height: 1rem; }
.ikon-saja { padding: 0.3rem; min-width: 1.9rem; justify-content: center; }
.ikon-saja .ikon { width: 1.05rem; height: 1.05rem; }
.ikon-besar .ikon, .ikon-besar { width: 1.6rem; height: 1.6rem; }

.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding: 0.5rem 1rem;
  background: var(--panel);
  border-bottom: 1px solid var(--garis);
}
.bar-merek { display: flex; align-items: baseline; gap: 0.9rem; flex-wrap: wrap; min-width: 0; }
.bar h1 { margin: 0; font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.bar-meta {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 0.15rem 0.85rem;
  color: var(--teks-lembut);
  font-size: 0.76rem;
}
.bar-meta span { display: inline-flex; align-items: center; gap: 0.25rem; white-space: nowrap; }
.bar-meta i { color: var(--teks-lembut); }
.bar-meta b { color: var(--teks); font-weight: 700; font-variant-numeric: tabular-nums; }
.bar-alat { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-left: auto; }

.badan { flex: 1 1 auto; display: flex; min-height: 0; }
.peta { position: relative; flex: 1 1 auto; min-width: 0; background: var(--kanvas); }
#jejaring { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#jejaring.menyeret { cursor: grabbing; }

.alat-peta {
  position: absolute;
  left: 0.75rem;
  bottom: 0.75rem;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.25rem;
  background: var(--panel);
  border: 1px solid var(--garis);
  border-radius: 8px;
}
.alat-peta .tombol { min-width: 1.9rem; justify-content: center; padding: 0.25rem 0.45rem; font-size: 0.75rem; border-radius: 6px; }
.zoom-tingkat { padding: 0 0.3rem; color: var(--teks-lembut); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
/* Chip penanda manifest. Atribut hidden harus menang atas display di bawah,
   kalau tidak chip bocor ke layar saat belum ada perubahan. */
.kap[hidden] { display: none; }
.kap {
  display: inline-block;
  padding: 0.2rem 0.5rem;
  border: 1px solid var(--garis-keras);
  border-radius: 999px;
  background: var(--panel);
  color: var(--teks);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
}
.kap:hover { border-color: var(--aksen); color: var(--aksen); }
.kap.bahaya { border-color: var(--sebagian); color: var(--sebagian); }
.kap.bahaya:hover { border-color: var(--sebagian); color: var(--sebagian); }
.minimap {
  position: absolute;
  right: 0.75rem;
  bottom: 0.75rem;
  z-index: 5;
  width: 190px;
  height: 124px;
  background: var(--panel);
  border: 1px solid var(--garis);
  border-radius: 8px;
  overflow: hidden;
  cursor: crosshair;
}
#minimap { display: block; width: 100%; height: 100%; }
#minimap .mini-edge { stroke-opacity: 0.2; }
#minimap .mini-node { opacity: 0.8; }
#minimap .mini-viewport { fill: var(--aksen); fill-opacity: 0.12; stroke: var(--aksen); stroke-width: 12; }

.pohon {
  flex: 0 0 250px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-right: 1px solid var(--garis);
  font-size: 0.82rem;
}
.pohon-kepala {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.5rem 0.6rem 0.5rem 0.85rem;
  border-bottom: 1px solid var(--garis);
}
.pohon-kepala h2 {
  margin: 0;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--teks-lembut);
}
.pohon-kepala-alat { display: flex; align-items: center; gap: 0.25rem; }
.pohon-kecil { display: none; }
.pohon-isi { flex: 1 1 auto; overflow: auto; padding: 0.3rem 0.45rem 0.6rem; }
.pohon-grup { margin-top: 0.5rem; }
.pohon-grup:first-child { margin-top: 0; }
.pohon-grup h3 {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin: 0 0 0.1rem;
  padding: 0 0.3rem;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--grup-warna, var(--teks-lembut));
}
.pohon-grup-tombol {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  width: 100%;
  padding: 0.1rem 0.2rem;
  background: none;
  border: 0;
  border-radius: 6px;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  text-align: left;
  cursor: pointer;
}
.pohon-grup-tombol:hover { background: var(--panel-lembut); }
.pohon-grup-tombol .chevron { width: 0.7rem; height: 0.7rem; transition: transform 0.12s linear; }
.pohon-grup.tertutup .pohon-grup-tombol .chevron { transform: rotate(0deg); }
.pohon-grup:not(.tertutup) .pohon-grup-tombol .chevron { transform: rotate(90deg); }
.pohon-grup.tertutup .pohon-item { display: none; }
.pohon-grup h3 span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pohon-grup h3 b { font-weight: 700; color: var(--teks); font-variant-numeric: tabular-nums; }
.pohon-grup h3 .ikon { width: 0.9rem; height: 0.9rem; }
.pohon-detail summary .ikon { width: 0.8rem; height: 0.8rem; }
.bagian > summary > .ikon { width: 1rem; height: 1rem; }
.pohon-item { border-radius: 6px; }
.pohon-pilih {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  width: 100%;
  padding: 0.22rem 0.3rem;
  background: none;
  border: 0;
  border-radius: 6px;
  color: var(--teks);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.pohon-nama { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pohon-pilih:hover, .pohon-sub:hover { background: var(--panel-lembut); }
.pohon-pilih.terpilih, .pohon-sub.terpilih { background: var(--aksen-lembut); color: var(--aksen); font-weight: 600; }
.pohon-detail { margin: 0 0 0.1rem 0.75rem; padding-left: 0.45rem; border-left: 1px solid var(--garis); }
.pohon-detail ul { list-style: none; margin: 0.05rem 0 0.3rem; padding-left: 0.15rem; }
.pohon-detail summary {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  cursor: pointer;
  list-style: none;
  padding: 0.1rem 0.3rem;
  color: var(--teks-lembut);
  font-size: 0.7rem;
  border-radius: 6px;
}
.pohon-detail summary::-webkit-details-marker { display: none; }
.pohon-detail summary:hover { background: var(--panel-lembut); }
.pohon-detail summary .chevron { transition: transform 0.12s linear; }
.pohon-detail[open] > summary .chevron { transform: rotate(90deg); }
.pohon-angka { font-variant-numeric: tabular-nums; }
.pohon-sub {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  width: 100%;
  padding: 0.16rem 0.3rem;
  background: none;
  border: 0;
  border-radius: 6px;
  color: var(--teks-lembut);
  font: inherit;
  font-size: 0.78rem;
  text-align: left;
  cursor: pointer;
}
.pohon .redup { opacity: var(--redup); }
.status-titik { flex: 0 0 0.45rem; width: 0.45rem; height: 0.45rem; border-radius: 50%; display: inline-block; }
.pohon-kaki {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 0.85rem;
  border-top: 1px solid var(--garis);
  font-size: 0.74rem;
  color: var(--teks-lembut);
}
.pohon-kaki .hasil { margin: 0; }

.detail {
  flex: 0 0 360px;
  overflow: auto;
  padding: 0.75rem 0.9rem 1.5rem;
  background: var(--panel);
  border-left: 1px solid var(--garis);
  font-size: 0.84rem;
}
.detail-kosong {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  margin-top: 3rem;
  color: var(--teks-lembut);
}
.detail-kosong i .ikon { width: 2rem; height: 2rem; stroke-width: 1.2; }
.detail-kosong p { margin: 0; font-size: 0.8rem; }
.jejak {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem;
  margin-bottom: 0.6rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--garis);
  color: var(--teks-lembut);
  font-size: 0.74rem;
}
.jejak .pemisah { width: 0.8rem; height: 0.8rem; color: var(--garis-keras); }
.jejak-aktif { color: var(--teks); font-weight: 600; }
.detail-kepala { display: flex; align-items: flex-start; gap: 0.6rem; }
.detail-kepala h2 { margin: 0 0 0.2rem; font-size: 1.05rem; line-height: 1.25; letter-spacing: -0.01em; }
.detail-kepala > .ikon { width: 1.5rem; height: 1.5rem; margin-top: 0.15rem; color: var(--aksen); }
.tile-kepala {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 9px;
  background: color-mix(in srgb, var(--grup-warna, var(--aksen)) 18%, transparent);
  color: var(--grup-warna, var(--aksen));
}
.tile-kepala .ikon { width: 1.2rem; height: 1.2rem; stroke-width: 2; }
.ringkas { margin: 0.5rem 0 0; color: var(--teks-lembut); font-size: 0.82rem; }
.kunci {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin: 0.55rem 0 0;
  padding: 0.35rem 0.5rem;
  background: var(--aksen-lembut);
  border-radius: 6px;
  color: var(--aksen);
  font-size: 0.8rem;
  font-weight: 600;
}
.kunci .ikon { width: 1rem; height: 1rem; }
.bagian { margin-top: 0.55rem; border: 1px solid var(--garis); border-radius: 8px; }
.bagian > summary {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.4rem 0.55rem;
  cursor: pointer;
  list-style: none;
  color: var(--teks-lembut);
  font-size: 0.78rem;
  font-weight: 600;
}
.bagian > summary::-webkit-details-marker { display: none; }
.bagian > summary:hover { background: var(--panel-lembut); }
.bagian > summary span { flex: 1 1 auto; }
.bagian > summary .chevron { width: 0.85rem; height: 0.85rem; transition: transform 0.12s linear; }
.bagian[open] > summary .chevron { transform: rotate(90deg); }
.bagian-isi { padding: 0.1rem 0.6rem 0.55rem; border-top: 1px solid var(--garis); }
.bagian-sub {
  margin: 0.5rem 0 0.15rem;
  color: var(--teks-lembut);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.detail p { margin: 0.3rem 0; font-size: 0.84rem; }
.detail ul { margin: 0.3rem 0; padding-left: 1.05rem; font-size: 0.82rem; }
.detail li { margin: 0.2rem 0; }
.detail ul ul { margin: 0.15rem 0 0.35rem; padding-left: 1rem; }
.dot-list { list-style: none; padding-left: 0; }
.dot-list > li { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem; }
.tautan-list { list-style: none; padding-left: 0; }
.tautan-list > li { padding: 0.12rem 0; }
.relasi-list { list-style: none; padding-left: 0; }
.relasi-list > li { display: flex; align-items: baseline; gap: 0.35rem; padding: 0.12rem 0; }
.relasi-label { color: var(--teks-lembut); font-size: 0.76rem; }
.operasi-list { list-style: none; padding-left: 0; }
.operasi-list > li { padding: 0.08rem 0; }
.daftar-sub > li { margin-bottom: 0.5rem; }
.detail a { color: var(--aksen); text-underline-offset: 2px; }
.detail-badge { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.25rem; }
.badge-status {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.1rem 0.4rem;
  border: 1px solid var(--garis);
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 700;
}
.badge-service {
  display: inline-flex;
  padding: 0.1rem 0.4rem;
  background: var(--panel-lembut);
  border-radius: 4px;
  font-size: 0.7rem;
  color: var(--teks-lembut);
}
.badge-aktif { color: var(--aktif); border-color: var(--aktif); }
.badge-sebagian { color: var(--sebagian); border-color: var(--sebagian); }
.badge-dimatikan { color: var(--mati); border-color: var(--mati); }
.badge-direncanakan { color: var(--rencana); border-color: var(--rencana); }
.tautan-node {
  padding: 0;
  background: none;
  border: 0;
  color: var(--aksen);
  font: inherit;
  font-size: inherit;
  text-align: left;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.detail-kecil { margin: 0.2rem 0; color: var(--teks-lembut); font-size: 0.8rem; }

.legenda {
  flex: 0 0 auto;
  padding: 0.6rem 0.85rem 0.8rem;
  border-top: 1px solid var(--garis);
  color: var(--teks-lembut);
  font-size: 0.72rem;
}
.legenda > div { margin-top: 0.45rem; }
.legenda > div:first-child { margin-top: 0; }
.legenda h2 { display: flex; align-items: center; gap: 0.3rem; margin: 0 0 0.2rem; color: var(--teks-lembut); font-size: 0.72rem; font-weight: 600; }
.legenda h2 .ikon { width: 0.95rem; height: 0.95rem; }
.legenda-baris { display: flex; flex-wrap: wrap; gap: 0.15rem 0.6rem; }
.legenda-item { display: inline-flex; align-items: center; gap: 0.3rem; }
.bar-legenda { width: 0.28rem; height: 0.75rem; border-radius: 2px; display: inline-block; }
.garis-legenda { width: 1.1rem; border-top: 2px solid currentColor; display: inline-block; }

.cari { position: relative; display: block; padding: 0.45rem 0.6rem 0.3rem; }
.cari i { position: absolute; left: 1.05rem; top: 0.66rem; color: var(--teks-lembut); pointer-events: none; }
.cari input {
  width: 100%;
  padding: 0.3rem 0.5rem 0.3rem 1.9rem;
  background: var(--bg);
  color: var(--teks);
  border: 1px solid var(--garis);
  border-radius: 6px;
  font: inherit;
  font-size: 0.8rem;
}
.pilih-kontrol { display: flex; align-items: center; gap: 0.3rem; color: var(--teks-lembut); }
.pilih-kontrol select {
  padding: 0.3rem 1.5rem 0.3rem 0.5rem;
  background: var(--bg);
  color: var(--teks);
  border: 1px solid var(--garis);
  border-radius: 6px;
  font: inherit;
  font-size: 0.8rem;
}
.segmen { display: inline-flex; padding: 0.15rem; background: var(--bg); border: 1px solid var(--garis); border-radius: 7px; }
.segmen .tombol { border: 0; border-radius: 5px; padding: 0.25rem 0.55rem; background: transparent; font-size: 0.78rem; }
.segmen .tombol .ikon { width: 0.95rem; height: 0.95rem; }
.segmen .tombol + .tombol { margin-left: 0.15rem; }
.segmen .tombol.terpilih { background: var(--panel); box-shadow: inset 0 0 0 1px var(--garis); color: var(--aksen); font-weight: 600; }
.tombol {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.3rem 0.6rem;
  background: var(--panel);
  color: var(--teks);
  border: 1px solid var(--garis);
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
}
