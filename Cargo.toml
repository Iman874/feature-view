[package]
name = "feature-view"
version = "0.2.0"
edition = "2021"
description = "Peta fitur monorepo dari tujuh manifest TSV: validasi, audit klaim terhadap kode, dan satu halaman HTML tanpa dependency."
readme = "README.md"
keywords = ["monorepo", "documentation", "architecture", "visualization", "zero-dependency"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"
